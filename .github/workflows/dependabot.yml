version: 2
updates:
 -package-ecoystem: "github-actions"
 directory: "/"
 schedule:
   interval: "weekly"
 open-pull-requests-limit: 3
 groups:
   actions:
     patterns: ["*"]
 -package-ecosystem: "pip"
 directories: ["/services/tasks-api", "services/title-normalizer"]
 schedule:
   interval: "weekly"
 open-pull-requests-limit: 3
 -package-ecosystem: "docker"
 directories: ["/services/tasks-api", "services/title-normalizer"]
 schedule:
   interval: "weekly"
 open-pull-requests-limit: 3
 ignore:
    -dependency-name: "python"
    update-types: ["version-update: semwe-major", "version-update: semwer-minor"]
 groups:
   base-images:
     patterns: ["python"]
